<div class="field">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} (optional){% endif %}</label>
  {{ field }}
  {% for error in field.errors %}<p class="error-text">{{ error }}</p>{% endfor %}
  {% if field.help_text %}<p class="helper" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
</div>
